{% extends "base.html" %}
{% block title %}Battle — ShawtyBot Pokémon{% endblock %}
{% block content %}
<div class="battle-room-header">
    <div>
        <h1 id="br-title">{{ battle.name_a }} vs {{ battle.name_b }}</h1>
        <p class="muted" id="br-subtitle">{{ battle.battle_type|capitalize }} battle · Turn {{ battle.turn_number }}</p>
    </div>
    <div class="battle-room-header-actions">
        <span class="muted" id="br-connection-status">Connecting...</span>
        <button id="br-forfeit-btn" class="btn-secondary" hidden>Forfeit</button>
    </div>
</div>

<div id="br-result" class="battle-result-banner" hidden></div>

<div class="battle-scene" id="br-scene">
    <div class="battle-turn-badge" id="br-turn-badge">Turn {{ battle.turn_number }}</div>

    <div class="battle-scene-row battle-scene-row-top">
        <div class="battle-hud" id="br-hud-b"></div>
        <div class="battle-sprite-slot">
            <div class="battle-platform"></div>
            <img class="battle-sprite" id="br-sprite-b" alt="">
        </div>
    </div>

    <div class="battle-scene-row battle-scene-row-bottom">
        <div class="battle-sprite-slot">
            <div class="battle-platform"></div>
            <img class="battle-sprite" id="br-sprite-a" alt="">
        </div>
        <div class="battle-hud" id="br-hud-a"></div>
    </div>
</div>

<div class="card" id="br-action-panel" hidden></div>

<h2 style="margin-top: 24px;">Battle Log</h2>
<div class="battle-log" id="br-log"></div>

<script type="application/json" id="battle-data">{{ battle_json|safe }}</script>
<script>window.BATTLE_ID = {{ battle_id }};</script>
<script src="/static/battle_room.js"></script>
{% endblock %}
