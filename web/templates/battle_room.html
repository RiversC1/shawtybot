{% extends "base.html" %}
{% block title %}Battle — ShawtyBot Pokémon{% endblock %}
{% block content %}
<h1 id="br-title">{{ battle.name_a }} vs {{ battle.name_b }}</h1>
<p class="muted" id="br-subtitle">{{ battle.battle_type|capitalize }} battle · Turn {{ battle.turn_number }}</p>

<div id="br-result" class="battle-result-banner" hidden></div>

<div class="battle-room-sides" id="br-sides">
    <div class="card battle-side-card" id="br-side-a">
        <div class="battle-side-name">{{ battle.name_a }}</div>
    </div>
    <div class="card battle-side-card" id="br-side-b">
        <div class="battle-side-name">{{ battle.name_b }}</div>
    </div>
</div>

<h2 style="margin-top: 24px;">Battle Log</h2>
<div class="battle-log" id="br-log"></div>

<script type="application/json" id="battle-data">{{ battle_json|safe }}</script>
<script>window.BATTLE_ID = {{ battle_id }};</script>
<script src="/static/battle_room.js"></script>
{% endblock %}
