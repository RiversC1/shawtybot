name: Deploy Web App

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - "deploy/nginx_websockets.sh"
      - "deploy/nginx_http2.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/shawtybot
            git pull origin main
            source venv/bin/activate
            pip install -r web/requirements.txt
            # Let nginx pass WebSocket upgrades through (live battle/trade updates).
            bash deploy/nginx_websockets.sh 8080
            # HTTP/2: the browser fetches a page's files in parallel over one connection.
            bash deploy/nginx_http2.sh 8080
            sudo systemctl restart shawtybot-web
            sleep 2
            sudo systemctl is-active shawtybot-web
