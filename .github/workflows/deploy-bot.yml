name: Deploy Bot

# The Pokémon game is shut down (its code stays in the repo): the bot no longer
# loads cogs.pokemon, and the internal game API (shawtybot-api) is stopped.

on:
  push:
    branches: [main]
    paths:
      - "cogs/**"
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/deploy-bot.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/shawtybot
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            # Final copy of the Pokémon game's data, made once before its API
            # is stopped (the live pokemon.db stays where it is, untouched).
            mkdir -p backups
            if [ -f pokemon.db ] && [ ! -f backups/pokemon-final.db ]; then
              python -c "import sqlite3; s = sqlite3.connect('pokemon.db'); d = sqlite3.connect('backups/pokemon-final.db'); s.backup(d); d.close(); print('Backed up pokemon.db ->', 'backups/pokemon-final.db')"
            fi
            ls -la backups/ || true
            # The game API is no longer used: stop it and keep it from starting on boot.
            sudo systemctl disable --now shawtybot-api || true
            # On a failed restart, print why (status + recent log) so the
            # Actions log shows the cause without SSHing in.
            if ! sudo systemctl restart shawtybot; then
              sudo systemctl status shawtybot --no-pager -l || true
              exit 1
            fi
            sleep 3
            if ! sudo systemctl is-active shawtybot; then
              sudo journalctl -u shawtybot -n 40 --no-pager || true
              exit 1
            fi
            echo "Deployed $(git log --oneline -1)"
