name: Deploy Bot & Internal API

on:
  push:
    branches: [main]
    paths:
      - "cogs/**"
      - "bot.py"
      - "webapi.py"
      - "battle_engine.py"
      - "battle_store.py"
      - "trade_store.py"
      - "legend_card.py"
      - "assets/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/deploy-bot.yml"
      - "deploy/nginx_websockets.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/shawtybot
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            # Let nginx pass WebSocket upgrades through (live battle/trade updates).
            bash deploy/nginx_websockets.sh 8000
            # On a failed restart, print why (status + recent log) so the
            # Actions log shows the cause without SSHing in.
            for svc in shawtybot shawtybot-api; do
              if ! sudo systemctl restart "$svc"; then
                sudo systemctl status "$svc" --no-pager -l || true
                exit 1
              fi
            done
            sleep 3
            for svc in shawtybot shawtybot-api; do
              if ! sudo systemctl is-active "$svc"; then
                sudo journalctl -u "$svc" -n 40 --no-pager || true
                exit 1
              fi
            done
            echo "Deployed $(git log --oneline -1)"
